{% extends "base.html" %}

{% block title %}Editar usuario | ESPRES UPEA{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="mb-4">Editar usuario</h2>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control"
                                   value="{{ usuario.nombre }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Apellido</label>
                            <input type="text" name="apellido" class="form-control"
                                   value="{{ usuario.apellido }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" name="correo" class="form-control"
                                   value="{{ usuario.correo }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" name="password" class="form-control"
                                   minlength="8">
                            <small class="text-muted">
                                Déjala vacía si no deseas cambiarla.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rol</label>
                            <select name="rol" class="form-select">
                                <option value="usuario"
                                    {% if usuario.rol == "usuario" %}selected{% endif %}>
                                    Usuario
                                </option>
                                <option value="admin"
                                    {% if usuario.rol == "admin" %}selected{% endif %}>
                                    Administrador
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="1"
                                    {% if usuario.estado %}selected{% endif %}>
                                    Activo
                                </option>
                                <option value="0"
                                    {% if not usuario.estado %}selected{% endif %}>
                                    Inactivo
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>

                        <a href="{{ url_for('usuarios.listar') }}"
                           class="btn btn-secondary">
                            Cancelar
                        </a>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
